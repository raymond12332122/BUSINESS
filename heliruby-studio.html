<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1c1e23">
<title>HELIRUBY Studio</title>
<style>
:root{
  --bg:#f4f2ee;--surface:#ffffff;--surface2:#e9e6df;--ink:#1c1e23;--muted:#666a72;--line:#d6d2c8;
  --accent:#2d5bd0;--accent-ink:#ffffff;--helios:#e2a012;--ruby:#a51f3b;--danger:#c23a2b;--ok:#2f8a57;
  --c1:#e4e4e4;--c2:#ffffff;--r:12px;--tabh:62px;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14161a;--surface:#1e2127;--surface2:#2a2e35;--ink:#eceae4;--muted:#a1a4ab;--line:#373b43;--accent:#7395ff;--accent-ink:#0b0e1a;--danger:#ff7a6b;--c1:#2b2b2b;--c2:#363636;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#14161a;--surface:#1e2127;--surface2:#2a2e35;--ink:#eceae4;--muted:#a1a4ab;--line:#373b43;--accent:#7395ff;--accent-ink:#0b0e1a;--danger:#ff7a6b;--c1:#2b2b2b;--c2:#363636;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h2{font-size:20px;margin:0 0 6px}h3{font-size:18px;margin:0 0 10px}h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px}
p{margin:6px 0}
.i{width:20px;height:20px;flex:none}
.muted{color:var(--muted)}.small{font-size:13px}.grow{flex:1;min-width:0}.center{text-align:center}
.topbar{flex:none;display:flex;align-items:center;gap:6px;min-height:54px;padding:4px 8px 4px 12px;padding-top:calc(4px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0;font-weight:800;font-size:15px;letter-spacing:.03em;line-height:1.15}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{border:0;font-size:12px;font-weight:600;padding:6px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.status.ok{color:var(--ok)}.status.warn{background:#fbe3bf;color:#6f4300}
main{flex:1;min-height:0;position:relative}
.tab{position:absolute;inset:0;overflow:auto;padding:12px 12px 32px;display:none;-webkit-overflow-scrolling:touch}
.tab.active{display:block}
.tab .wrapin{max-width:880px;margin:0 auto}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{height:var(--tabh);border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:650;position:relative}
.tabbar button .i{width:24px;height:24px}
.tabbar button.active{color:var(--accent)}
.tabbar button.active::after{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.btn{min-height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;user-select:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.solid.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{min-height:40px;padding:0 10px;font-size:14px}
.btn.icon{width:46px;padding:0}.btn.sm.icon{width:40px}
.btn.wide{width:100%}
.btn:disabled{opacity:.35;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:14px}
.row.nowrap{flex-wrap:nowrap}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.note{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.chip{flex:none;min-height:42px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;position:relative}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .cnt{font-size:12px;opacity:.65}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.inp,select,textarea{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;font:inherit;font-size:16px}
textarea{resize:vertical;min-height:70px}
.inp:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=color].inp{padding:4px;height:46px}
input[type=range]{width:100%;height:36px;accent-color:var(--accent)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
label.f{display:flex;justify-content:space-between;font-size:13px;font-weight:650;color:var(--muted);margin:10px 0 4px}
label.f output{color:var(--ink);font-variant-numeric:tabular-nums}
label.ck{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 8px}
.wrapbtns{margin:6px 0}
details>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:650;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"▾";margin-left:auto;color:var(--muted)}
details[open]>summary::after{content:"▴"}
/* references */
.profile summary{gap:12px}
.avatar{width:54px;height:54px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--surface2);border:3px solid var(--line);font-weight:800;color:var(--muted)}
.avatar img{width:100%;height:100%;object-fit:cover}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sw{width:46px;height:46px;border-radius:10px;border:1px solid var(--line)}
.addcol{position:relative;overflow:hidden}
.addcol input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--th,108px),1fr));gap:8px;margin-top:10px}
.thumbs.size-s{--th:78px}.thumbs.size-m{--th:108px}.thumbs.size-l{--th:160px}
.thumb{position:relative;display:flex;flex-direction:column;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;text-align:left}
.ti{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--c1) 25%,var(--c2) 0 50%,var(--c1) 0 75%,var(--c2) 0);background-size:16px 16px}
.ti img{width:100%;height:100%;object-fit:contain;display:block}
.ti em{font-size:12px;color:var(--muted);padding:6px;text-align:center}
.thumb .tl{font-size:12.5px;font-weight:650;padding:5px 7px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb .tc{font-size:11px;color:var(--muted);padding:0 7px 6px}
.badge{position:absolute;top:5px;left:5px;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:#555;color:#fff;letter-spacing:.04em;text-transform:uppercase}
.b-official{background:#1d5fbf}.b-mine{background:#2f8a57}.b-puppet{background:#7a4fb5}
.thumb .fav{position:absolute;top:3px;right:6px;color:#f2b400;font-size:18px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.empty{text-align:center;padding:28px 14px;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r);margin-top:12px}
/* workspaces */
.tab.ws.active{display:flex;flex-direction:column;padding:0;overflow:hidden}
.ws .pane-top{flex:none;padding:8px 10px 2px;background:var(--surface);border-bottom:1px solid var(--line)}
.toolstrip{flex:none;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.tool{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:62px;height:58px;padding:0 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:11.5px;font-weight:650}
.tool .i{width:22px;height:22px}
.tool.sep{margin-left:6px}
.cwrap{flex:1 1 auto;min-height:180px;overflow:auto;display:flex;background:var(--surface2);padding:10px;position:relative}
.cwrap canvas{margin:auto;display:block;box-shadow:0 1px 4px rgba(0,0,0,.3);touch-action:none;flex:none}
.props{flex:none;max-height:42%;overflow:auto;background:var(--surface);border-top:1px solid var(--line)}
.props.collapsed{max-height:none}
.props.collapsed .pbody{display:none}
.phead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;min-height:52px;padding:4px 10px 4px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.phead b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody{padding:4px 14px 20px}
.list{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:6px;min-height:48px;padding:4px 6px 4px 4px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.lrow.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lmain{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;min-height:44px;padding:0 4px}
.lmain span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lmain img{width:38px;height:38px;object-fit:contain;border-radius:6px;background:conic-gradient(var(--c1) 25%,var(--c2) 0 50%,var(--c1) 0 75%,var(--c2) 0);background-size:10px 10px;flex:none}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.pagesel{min-width:0;flex:1}
@media (min-width:900px){
  .tab.ws.active{display:grid;grid-template-columns:1fr 390px;grid-template-rows:auto auto 1fr}
  .ws .pane-top,.ws .toolstrip{grid-column:1/-1}
  .ws .cwrap{grid-column:1;grid-row:3}
  .ws .props{grid-column:2;grid-row:3;max-height:none;border-top:0;border-left:1px solid var(--line)}
}
/* storyboard */
.chhead{display:flex;gap:8px;align-items:center}
.code{flex:none;font-weight:900;font-size:15px;padding:0 10px;height:46px;display:flex;align-items:center;border-radius:10px;background:var(--ink);color:var(--bg)}
.chtitle{font-weight:700}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px;margin:10px 0}
.pcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.pthumb{border:0;padding:8px;background:var(--surface2);display:flex;justify-content:center;align-items:flex-start;max-height:230px;overflow:hidden}
.pthumb canvas{width:100%;height:auto;display:block;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.plabel{padding:6px 8px 2px;font-weight:700;font-size:14px}
.plabel small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.pbtns{display:flex;justify-content:space-between;padding:4px}
.pcard.add{align-items:center;justify-content:center;gap:6px;min-height:150px;border-style:dashed;color:var(--muted);font-weight:650}
.pcard.add .i{width:28px;height:28px}
/* modals */
#modalRoot .modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.55);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.modal.dialog{align-items:center;padding:16px}
.modal.dialog .sheet{border-radius:16px;max-width:430px}
.modal.full .sheet{max-width:none;height:100vh;height:100dvh;max-height:none;border-radius:0;padding:0;display:flex;flex-direction:column}
@media (min-width:700px){.modal{align-items:center!important}.modal:not(.full) .sheet{border-radius:16px}}
.vhead{flex:none;display:flex;align-items:center;gap:8px;padding:8px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--surface)}
.vscroll{flex:1;overflow:auto}
.vimg{height:52vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:conic-gradient(var(--c1) 25%,var(--c2) 0 50%,var(--c1) 0 75%,var(--c2) 0);background-size:20px 20px;touch-action:pan-y}
.vimg img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.vimg.zoom{overflow:auto;display:block;touch-action:auto}
.vimg.zoom img{max-width:none;max-height:none}
.vform{padding:10px 14px calc(24px + env(safe-area-inset-bottom))}
.vnav{padding:8px 14px 0}
.pickbody{padding:12px 14px 24px;overflow:auto;flex:1}
.rbody{flex:1;overflow:auto;display:flex;background:#2a2c31;padding:8px;touch-action:pan-y}
.rbody canvas{margin:auto;display:block;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.rfoot{flex:none;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--surface)}
.lays{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.lay{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:650}
.lay svg{width:100%;height:auto}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{flex:1;min-height:46px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-weight:600}
pre.script{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,"Roboto Mono",monospace;background:var(--surface2);padding:12px;border-radius:10px;max-height:55vh;overflow:auto}
.help h3{margin-top:4px}.help li{margin:4px 0}.help details{border-top:1px solid var(--line)}.help details:first-of-type{border-top:0}
kbd{font:inherit;font-weight:700;background:var(--surface2);border-radius:5px;padding:0 5px}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--tabh) + 14px + env(safe-area-inset-bottom));z-index:100;max-width:min(92vw,520px);background:#1c1e23;color:#fff;padding:12px 16px;border-radius:12px;font-size:14.5px;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#8f2318}#toast.ok{background:#245f3e}
.welcome ol{padding-left:20px}.welcome li{margin:6px 0}
</style>
</head>
<body>
<noscript><p style="padding:20px">HELIRUBY Studio needs JavaScript. Please open this file in Chrome or another modern browser.</p></noscript>

<header class="topbar">
  <div class="brand">HELIRUBY Studio<small id="projTitle">Loading…</small></div>
  <button id="saveStatus" class="status" data-act="tab" data-tab="more" title="Storage status">Loading…</button>
  <button class="btn icon sm" id="undoBtn" data-act="undo" aria-label="Undo" title="Undo"></button>
  <button class="btn icon sm" id="redoBtn" data-act="redo" aria-label="Redo" title="Redo"></button>
</header>

<main>
  <section class="tab" id="tab-refs" aria-label="References"></section>

  <section class="tab ws" id="tab-puppet" aria-label="Puppet workspace">
    <div class="pane-top"><div class="scrollx" id="pupChars"></div></div>
    <div class="toolstrip scrollx" id="pupTools"></div>
    <div class="cwrap" id="pupWrap"><canvas id="pupCanvas" width="10" height="10"></canvas></div>
    <div class="props" id="pupProps"></div>
  </section>

  <section class="tab ws" id="tab-pages" aria-label="Panel editor">
    <div class="pane-top"><div class="row nowrap" style="padding-bottom:6px">
      <button class="btn icon" data-act="pgPrev" aria-label="Previous page" id="pgPrevBtn"></button>
      <select id="pageSel" class="pagesel" aria-label="Choose page"></select>
      <button class="btn icon" data-act="pgNext" aria-label="Next page" id="pgNextBtn"></button>
      <button class="btn icon" data-act="addPageHere" aria-label="Add page after this one" id="pgAddBtn"></button>
      <button class="btn icon" data-act="pageSettings" aria-label="Page settings" id="pgSetBtn"></button>
    </div></div>
    <div class="toolstrip scrollx" id="edTools"></div>
    <div class="cwrap" id="edWrap"><canvas id="edCanvas" width="10" height="10"></canvas></div>
    <div class="props" id="edProps"></div>
  </section>

  <section class="tab" id="tab-story" aria-label="Storyboard"></section>
  <section class="tab" id="tab-more" aria-label="Save, export and help"></section>
</main>

<nav class="tabbar" id="tabbar"></nav>
<div id="modalRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   HELIRUBY Studio — single-file comic workbench
   Data lives in IndexedDB (project JSON + images as data URLs).
   No network requests are made; everything works offline once loaded.
   ===================================================================== */

/* ---------- tiny helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const uid=(p='id')=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=v=>String(Math.round(v*100)/100);
const deep=o=>JSON.parse(JSON.stringify(o));
const normDeg=d=>((d+180)%360+360)%360-180;
function rotPt(cx,cy,lx,ly,r){const c=Math.cos(r),s=Math.sin(r);return{x:cx+lx*c-ly*s,y:cy+lx*s+ly*c};}
function toLocal(cx,cy,r,p){const dx=p.x-cx,dy=p.y-cy,c=Math.cos(r),s=Math.sin(r);return{x:dx*c+dy*s,y:-dx*s+dy*c};}
function initials(n){return String(n).split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();}
function slug(s,max=32){return String(s).normalize('NFKD').replace(/[^\w]+/g,'-').slice(0,max).replace(/^-+|-+$/g,'')||'comic';}
function dateStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/4294967295;}
function srand(seed,i){const x=Math.sin(seed*9301+i*49.297)*233280;return x-Math.floor(x);}
function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('decode'));i.src=src;});}
function readAsDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f);});}
function fitInto(w,h,mw,mh){const k=Math.min(mw/w,mh/h);return{w:w*k,h:h*k};}
function hex6(c){c=String(c||'');if(/^#[0-9a-f]{6}$/i.test(c))return c;if(/^#[0-9a-f]{3}$/i.test(c))return '#'+c.slice(1).split('').map(x=>x+x).join('');return '#000000';}
function dataURLtoBlob(d){const i=d.indexOf(',');const meta=d.slice(5,i);const mime=meta.split(';')[0]||'application/octet-stream';const b64=/;base64/.test(meta);const s=b64?atob(d.slice(i+1)):decodeURIComponent(d.slice(i+1));const u=new Uint8Array(s.length);for(let k=0;k<s.length;k++)u[k]=s.charCodeAt(k);return new Blob([u],{type:mime});}
function friendlyErr(e){if(!e)return 'Unknown error';const n=e.name||'';if(n==='QuotaExceededError'||/quota/i.test(e.message||''))return 'Storage is full on this device. Save a project file as a backup, then remove unused images (More → Clean unused images).';return e.message||String(e);}

/* ---------- icons (simple line icons drawn for this tool) ---------- */

/* =====================================================================

   ===================================================================== */
let db=null;
const memImages=new Map();   // imgId -> dataURL
const urlCache=new Map();    // imgId -> blob: URL (cheap for <img>)
const imgCache=new Map();    // imgId -> HTMLImageElement (for canvas)
const alphaCache=new Map();  // imgId -> small alpha map for hit testing
function openDB(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open('heliruby-studio',1);}catch(e){rej(e);return;}
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('images'))d.createObjectStore('images');};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('IndexedDB failed'));r.onblocked=()=>rej(new Error('Storage is blocked by another open tab.'));
  setTimeout(()=>rej(new Error('Storage did not respond.')),6000);});}
function idb(store,mode,fn){return new Promise((res,rej)=>{let tx;try{tx=db.transaction(store,mode);}catch(e){rej(e);return;}const st=tx.objectStore(store);let out;const r=fn(st);if(r)r.onsuccess=()=>{out=r.result;};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('Storage write aborted'));});}
async function putImage(id,dataURL){memImages.set(id,dataURL);if(!db)return;try{await idb('images','readwrite',s=>s.put(dataURL,id));}catch(e){memImages.delete(id);throw new Error(friendlyErr(e));}}
async function deleteImage(id){memImages.delete(id);const u=urlCache.get(id);if(u&&u.startsWith('blob:'))URL.revokeObjectURL(u);urlCache.delete(id);imgCache.delete(id);alphaCache.delete(id);if(db)await idb('images','readwrite',s=>s.delete(id));}
async function loadAllImages(){if(!db)return;const keys=await idb('images','readonly',s=>s.getAllKeys());const vals=await idb('images','readonly',s=>s.getAll());keys.forEach((k,i)=>memImages.set(k,vals[i]));}
function urlFor(id){let u=urlCache.get(id);if(u)return u;const d=memImages.get(id);if(!d)return '';try{u=URL.createObjectURL(dataURLtoBlob(d));}catch(e){u=d;}urlCache.set(id,u);return u;}
let refreshT;
function getImg(id){if(!id)return null;let im=imgCache.get(id);if(im)return(im.complete&&im.naturalWidth)?im:null;if(!memImages.has(id))return null;im=new Image();im.onload=()=>{clearTimeout(refreshT);refreshT=setTimeout(redrawAll,30);};im.src=urlFor(id);imgCache.set(id,im);return null;}
async function ensureImgs(ids){await Promise.all(ids.map(id=>{getImg(id);const im=imgCache.get(id);if(!im||(im.complete&&im.naturalWidth))return null;return new Promise(r=>{im.addEventListener('load',r,{once:true});im.addEventListener('error',r,{once:true});setTimeout(r,8000);});}));}

/* save state */
let saveT=null,saving=false,dirty=false;
function setStatus(t,kind=''){const s=$('#saveStatus');s.textContent=t;s.className='status '+kind;}
function scheduleSave(){dirty=true;if(db)setStatus('Saving…');clearTimeout(saveT);saveT=setTimeout(saveNow,700);}
async function saveNow(){clearTimeout(saveT);if(!db){setStatus('Not stored — save a file','warn');return;}if(!dirty)return;if(saving){saveT=setTimeout(saveNow,400);return;}
  saving=true;dirty=false;try{await idb('kv','readwrite',s=>s.put(JSON.stringify(project),'project'));setStatus('Saved ✓','ok');}
  catch(e){dirty=true;setStatus('Save failed','warn');toast('Autosave failed: '+friendlyErr(e),'err');}finally{saving=false;}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow();});
window.addEventListener('pagehide',()=>saveNow());

  chapters:CHAPTER_PRESET.map(([code,title])=>({id:uid('ch'),code,title,notes:'',pages:[]})),pages:{},puppets:{}};
  const pg=makePage({});p.pages[pg.id]=pg;p.chapters[0].pages.push(pg.id);return p;}
function panelDefaults(){return{id:uid('pn'),x:0,y:0,w:300,h:300,border:6,borderColor:'#111111',bg:'#ffffff',bgImg:null,bgFit:'cover',bgOpacity:1,radius:0,note:'',items:[]};}
const ITEM_DEFAULTS={
  image:()=>({x:0,y:0,w:100,h:100,rot:0,flip:false,opacity:1,clip:true,imgId:null}),
  bubble:()=>({x:0,y:0,w:300,h:150,style:'speech',text:'',speaker:'',font:'comic',size:34,bold:false,italic:false,align:'center',tail:true,tx:0,ty:0,fill:'#ffffff',stroke:'#111111',textColor:'#111111',lineW:4,fit:true}),
  sfx:()=>({x:0,y:0,text:'SFX',font:'impact',size:120,rot:0,color:'#111111',stroke:'#ffffff',strokeW:8})};
function rigDefaults(){return{w:1000,h:1250,parts:[],poses:[],bg:'checker',grid:false,trace:null,traceOpacity:0.35,showTrace:true};}
function partDefaults(){return{id:uid('pt'),name:'Part',imgId:null,w:100,h:100,x:500,y:600,px:.5,py:.5,scale:1,rot:0,flip:false,opacity:1,hidden:false,locked:false};}
function makePage(o){const w=o.w||1200,h=o.h||1800;const pg={id:uid('pg'),name:'',w,h,bg:o.bg||'#ffffff',margin:o.margin??Math.round(w*.04),gutter:o.gutter??Math.round(w*.025),notes:'',panels:[]};
  applyLayout(pg,LAYOUTS.find(l=>l.id===(h/w>1.9?'3r':'1-2')));return pg;}
function layoutRects(pg,L){const m=pg.margin,g=pg.gutter,W=pg.w-2*m,H=pg.h-2*m;const tot=L.rows.reduce((a,r)=>a+r[0],0);const aH=H-g*(L.rows.length-1);let y=m;const out=[];
  for(const[hw,cols]of L.rows){const rh=aH*hw/tot,tw=cols.reduce((a,b)=>a+b,0),aW=W-g*(cols.length-1);let x=m;for(const cw of cols){const w=aW*cw/tw;out.push({x:Math.round(x),y:Math.round(y),w:Math.round(w),h:Math.round(rh)});x+=w+g;}y+=rh+g;}return out;}
function shiftItems(pn,dx,dy){for(const it of pn.items){it.x+=dx;it.y+=dy;if(it.type==='bubble'){it.tx+=dx;it.ty+=dy;}}}
function applyLayout(pg,L){const rects=layoutRects(pg,L);const bw=Math.max(2,Math.round(pg.w/200));rects.forEach((r,i)=>{let pn=pg.panels[i];
  if(pn){shiftItems(pn,r.x-pn.x,r.y-pn.y);Object.assign(pn,r);}else{pn=Object.assign(panelDefaults(),r,{border:bw});pg.panels.push(pn);}});return rects.length;}
function normalize(p){
  if(!p||typeof p!=='object')throw new Error('Not a project');
  p.app=APP_ID;p.version=1;p.title=typeof p.title==='string'?p.title:DEFAULT_TITLE;
  const chars=Array.isArray(p.characters)?p.characters.filter(c=>c&&c.id):[];
  for(const d of defaultChars().reverse())if(!chars.some(c=>c.id===d.id))chars.unshift(d);
  p.characters=chars.map(c=>Object.assign({name:'Character',color:'#777777',notes:'',palette:[],avatar:null,fixed:false},c,{color:hex6(c.color||'#777777'),palette:Array.isArray(c.palette)?c.palette.map(hex6):[]}));
  p.refs=(Array.isArray(p.refs)?p.refs:[]).filter(r=>r&&r.id&&r.imgId).map(r=>Object.assign({charId:'helios',w:100,h:100,label:'',cat:'other',source:'other',tags:'',notes:'',fav:false,added:Date.now()},r));
  p.pages=(p.pages&&typeof p.pages==='object')?p.pages:{};
  for(const id of Object.keys(p.pages)){const pg=p.pages[id];if(!pg||typeof pg!=='object'){delete p.pages[id];continue;}
    Object.assign(pg,Object.assign({name:'',w:1200,h:1800,bg:'#ffffff',margin:48,gutter:30,notes:'',panels:[]},pg,{id}));pg.bg=hex6(pg.bg);
    pg.panels=(Array.isArray(pg.panels)?pg.panels:[]).filter(Boolean).map(pn=>{const n=Object.assign(panelDefaults(),pn);n.items=(Array.isArray(n.items)?n.items:[]).filter(it=>it&&ITEM_DEFAULTS[it.type]).map(it=>Object.assign(ITEM_DEFAULTS[it.type](),it,{id:it.id||uid('it')}));return n;});}
  p.chapters=(Array.isArray(p.chapters)?p.chapters:[]).filter(Boolean).map(c=>Object.assign({id:uid('ch'),code:'C?',title:'',notes:'',pages:[]},c));
  if(!p.chapters.length)p.chapters=CHAPTER_PRESET.map(([code,title])=>({id:uid('ch'),code,title,notes:'',pages:[]}));
  const seen=new Set();for(const c of p.chapters){c.pages=(Array.isArray(c.pages)?c.pages:[]).filter(id=>p.pages[id]&&!seen.has(id)&&seen.add(id));}
  for(const id of Object.keys(p.pages))if(!seen.has(id))p.chapters[0].pages.push(id);
  p.puppets=(p.puppets&&typeof p.puppets==='object')?p.puppets:{};
  for(const k of Object.keys(p.puppets)){const r=Object.assign(rigDefaults(),p.puppets[k]);r.parts=(Array.isArray(r.parts)?r.parts:[]).filter(q=>q&&q.imgId).map(q=>Object.assign(partDefaults(),q));r.poses=Array.isArray(r.poses)?r.poses:[];p.puppets[k]=r;}
  return p;}
const charById=id=>project.characters.find(c=>c.id===id);
const allPageIds=()=>project.chapters.flatMap(c=>c.pages);
const chapterOf=pid=>project.chapters.find(c=>c.pages.includes(pid));
function pageLabel(pid){const ch=chapterOf(pid);const pg=project.pages[pid];if(!ch||!pg)return 'Page';return `${ch.code} · Page ${ch.pages.indexOf(pid)+1}${pg.name?' — '+pg.name:''}`;}
function referencedImageIds(){const s=new Set();project.characters.forEach(c=>c.avatar&&s.add(c.avatar));project.refs.forEach(r=>s.add(r.imgId));
  Object.values(project.pages).forEach(pg=>pg.panels.forEach(pn=>{if(pn.bgImg)s.add(pn.bgImg);pn.items.forEach(it=>it.imgId&&s.add(it.imgId));}));
  Object.values(project.puppets).forEach(r=>{if(r.trace)s.add(r.trace);r.parts.forEach(q=>s.add(q.imgId));});return s;}
function cloneWithIds(pg){const c=deep(pg);c.id=uid('pg');c.panels.forEach(pn=>{pn.id=uid('pn');pn.items.forEach(it=>it.id=uid('it'));});return c;}

/* ---------- undo / redo (snapshots of project JSON; images are stored separately) ---------- */
const hist={undo:[],redo:[],last:null,t:null};
function commit(debounced){clearTimeout(hist.t);const go=()=>{const s=JSON.stringify(project);if(s===hist.last)return;if(hist.last!==null){hist.undo.push(hist.last);if(hist.undo.length>60)hist.undo.shift();}hist.last=s;hist.redo.length=0;updateUndoBtns();scheduleSave();};if(debounced)hist.t=setTimeout(go,500);else go();}
function restoreSnap(s){project=JSON.parse(s);hist.last=s;updateUndoBtns();scheduleSave();updateTitle();renderTab(ui.tab);}
function updateUndoBtns(){$('#undoBtn').disabled=!hist.undo.length;$('#redoBtn').disabled=!hist.redo.length;}

function pickFiles({accept='image/*',multiple=true}={}){return new Promise(res=>{const i=document.createElement('input');i.type='file';if(accept)i.accept=accept;i.multiple=multiple;i.style.display='none';document.body.appendChild(i);i.addEventListener('change',()=>{res(Array.from(i.files||[]));i.remove();});i.click();});}
async function importImageFile(file,{maxSide=2400}={}){
  const name=file.name||'image';
  if(/\.(heic|heif)$/i.test(name)||/hei[cf]/i.test(file.type))throw new Error(`"${name}" is a HEIC photo, which browsers can't open. Convert it to JPG or PNG first.`);
  if(file.type&&!file.type.startsWith('image/'))throw new Error(`"${name}" is not an image file.`);
  if(file.size>40e6)throw new Error(`"${name}" is larger than 40 MB. Please resize it first.`);
  const url=URL.createObjectURL(file);let img;
  try{img=await loadImage(url);}catch(e){URL.revokeObjectURL(url);throw new Error(`Couldn't open "${name}". It may be damaged or in an unsupported format.`);}
  let w=img.naturalWidth,h=img.naturalHeight;if(!w||!h){URL.revokeObjectURL(url);throw new Error(`"${name}" has no size.`);}

const modals=[];

  const m=openModal(`<h3>${esc(o.title||'')}</h3>${o.msg?`<p>${o.msg}</p>`:''}${hasInp?`<input class="inp" id="askInp" value="${esc(o.input)}" placeholder="${esc(o.ph||'')}" maxlength="120">`:''}

  m.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{const ok=b.dataset.r==='1';fin(hasInp?(ok?inp.value.trim():null):ok);closeModal();}));});}

function pickImage(title='Choose an image'){return new Promise(res=>{let done=false;const fin=v=>{if(!done){done=true;res(v);}};let filt=charById(ui.charId)?ui.charId:'all';
  const m=openModal('',{cls:'full',onClose:()=>fin(null)});
  const draw=()=>{const refs=project.refs.filter(r=>filt==='all'||r.charId===filt);
    m.querySelector('.sheet').innerHTML=`<div class="vhead"><button class="btn icon" data-x="close" aria-label="Close">${I('close')}</button><b class="grow">${esc(title)}</b></div>
    <div class="pickbody"><button class="btn primary wide" data-x="upload">${I('upload')} Upload from this device</button>
    <p class="muted small" style="margin-top:12px">…or pick one of your references:</p>
    <div class="scrollx"><button class="chip ${filt==='all'?'on':''}" data-x="filt" data-id="all">All</button>${project.characters.map(c=>`<button class="chip ${filt===c.id?'on':''}" data-x="filt" data-id="${c.id}"><i class="dot" style="background:${c.color}"></i>${esc(c.name)}</button>`).join('')}</div>

function buildScript(){let out=project.title+'\n'+'='.repeat(Math.min(60,project.title.length))+'\n\n';

      pg.panels.forEach((pn,ni)=>{out+=`    Panel ${ni+1}${pn.note?': '+pn.note.replace(/\n+/g,' '):''}\n`;
        pn.items.forEach(it=>{if(it.type==='bubble'&&it.text.trim()){const who=it.style==='caption'?'CAPTION':(it.speaker||'?').toUpperCase();const how={thought:' (thought)',whisper:' (whisper)',shout:' (shout)'}[it.style]||'';out+=`      ${who}${how}: ${it.text.replace(/\s*\n\s*/g,' ')}\n`;}

/* Inside the Android app, window.HeliNative saves files through Android (pictures → Pictures/HELIRUBY, other files → Download/HELIRUBY). */
const NATIVE=(typeof window.HeliNative==='object'&&window.HeliNative)?window.HeliNative:null;
function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(b);});}
async function nativeSave(blob,name){const err=NATIVE.begin(name,blob.type||'application/octet-stream');if(err)throw new Error(err);
  try{const CH=786432;for(let o=0;o<blob.size;o+=CH){if(!NATIVE.write(await blobToB64(blob.slice(o,o+CH))))throw new Error('Could not write the file to your phone storage.');}}
  catch(e){NATIVE.abort();throw e;}const where=NATIVE.finish();if(where.startsWith('ERR:'))throw new Error(where.slice(4));return where;}
async function downloadBlob(blob,name){if(NATIVE)return nativeSave(blob,name);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);return 'Downloads';}
function canvasBlob(c,mime,q){return new Promise((res,rej)=>{try{c.toBlob(b=>b?res(b):rej(new Error('The browser could not create the image (it may be too large for this phone). Try a smaller size.')),mime,q);}catch(e){rej(e);}});}
async function shareFiles(files){if(!(navigator.canShare&&navigator.canShare({files})))throw new Error('Sharing files is not supported in this browser — use Download instead.');try{await navigator.share({files,title:project.title});}catch(e){if(e.name!=='AbortError')throw e;}}
async function pageCanvas(pg,scale){await ensureImgs(pageImgIds(pg));let s=scale;while(pg.w*s*pg.h*s>36e6||Math.max(pg.w,pg.h)*s>16000)s*=.85;const c=document.createElement('canvas');c.width=Math.round(pg.w*s);c.height=Math.round(pg.h*s);const x=c.getContext('2d');x.scale(s,s);renderPage(x,pg,{});return c;}
async function stripCanvas(ids,scale){const pgs=ids.map(i=>project.pages[i]);for(const pg of pgs)await ensureImgs(pageImgIds(pg));let W=Math.max(...pgs.map(p=>p.w))*scale;let H=pgs.reduce((a,p)=>a+p.h*(W/p.w),0);
  const f=Math.min(1,Math.sqrt(60e6/(W*H)),30000/H);if(f<1){W*=f;H*=f;toast('The strip was scaled down to fit this device’s image limits.');}const c=document.createElement('canvas');c.width=Math.round(W);c.height=Math.round(H);const x=c.getContext('2d');let y=0;
  for(const pg of pgs){const k=W/pg.w;x.save();x.translate(0,y);x.scale(k,k);renderPage(x,pg,{});x.restore();y+=pg.h*k;}return c;}

async function doExport(pid,o,share){const ch=chapterOf(pid);const ids=o.what==='page'?[pid]:o.what==='all'?allPageIds():ch.pages.slice();if(!ids.length)throw new Error('No pages to export.');

    if(share)await shareFiles([new File([b],name,{type:mime})]);else{const w=await downloadBlob(b,name);toast(`Exported ${name} to ${w}.`,'ok');}return;}
  const files=[];for(let i=0;i<ids.length;i++){toast(`Rendering page ${i+1} of ${ids.length}…`);const c=await pageCanvas(project.pages[ids[i]],o.scale);const b=await canvasBlob(c,mime,o.q);files.push(new File([b],exportName(ids[i],ext),{type:mime}));}
  if(share){await shareFiles(files);return;}let w='';for(const f of files){w=await downloadBlob(f,f.name);if(!NATIVE)await sleep(500);}toast(`Exported ${files.length} image(s) to ${w}.`,'ok');}

const HELP=`<h3>${I('help')} How to use HELIRUBY Studio</h3>
<details open><summary>Quick start (5 steps)</summary><ol>
<li><b>References:</b> pick Helios or Ruby at the top, tap <b>Add images</b>, then tap a picture to label it (category, source, tags).</li>
<li><b>Storyboard:</b> your five chapters are ready. Tap <b>Add page</b> in a chapter, or tap a page to open it.</li>
<li><b>Panels:</b> tap <b>Layout</b> to pick a panel arrangement, then add images, speech bubbles, captions and sound effects.</li>
<li><b>Read it:</b> tap ▶ <b>Read</b> in the Storyboard to flip through pages like a reader.</li>
<li><b>Export:</b> tap <b>Export</b> (Panels toolbar or More) to save PNG/JPEG images to your phone.</li></ol></details>
<details><summary>Saving your work (important)</summary><ul>
<li>Everything saves automatically in this browser. The chip at the top says <b>Saved ✓</b> when it's done.</li>
<li>Use <b>More → Save project file</b> regularly. It's your backup and includes all images. Open it with <b>More → Open project file</b> on any phone or computer.</li>
<li>If the chip says <b>Not stored</b>, your browser is blocking storage for this file (this can happen when an HTML file is opened straight from a file manager). Your work still exists until you close the tab, so save a project file before leaving, or open the tool from a web address instead.</li>
<li>Undo / redo are the arrows in the top-right corner.</li></ul></details>
<details><summary>References</summary><ul>
<li>Each profile (Helios, Ruby, Backgrounds & Props, or one you add) has its own images, notes and color swatches. Tap the profile card to edit notes and colors.</li>
<li>Filter with the category chips (Expression, Pose, Outfit, Emotion, Other, ★ Favorites), the Source menu, or search labels and tags.</li>
<li>Mark each image's <b>Source</b> so you always know which pictures are official art and which are your own drawings. Tiles show a badge: <b>Official</b>, <b>Mine</b> or <b>Puppet</b>.</li>
<li>In the viewer: swipe left/right to browse, tap the picture to zoom, ★ to favorite. From there you can drop the image into a panel, use it as a panel background, as a puppet part, or as a tracing guide.</li>
<li>iPhone HEIC photos can't be opened by browsers; convert them to JPG/PNG first.</li></ul></details>
<details><summary>Puppet (optional drawing aid)</summary><ul>
<li>Draw or cut out parts (head, torso, upper arm, forearm, hand, legs…) as separate <b>PNG files with transparent backgrounds</b>. JPEGs can't be transparent.</li>
<li>Tap a part to select it. Drag to move. The white corner dots resize; the blue dot on the stick rotates.</li>
<li>Turn on <b>Move pivot</b> and drag the blue center dot to the joint (e.g. the shoulder) so the arm swings naturally. Pivot buttons give quick presets.</li>
<li>Layers: the top of the list is in front. Hide (eye) or lock parts so you don't grab them by mistake. Tap the same spot twice to reach a part underneath.</li>
<li><b>Stage</b> lets you put a reference faintly behind the parts to trace a pose. <b>Poses</b> saves and reloads arrangements.</li>
<li>Use <b>PNG</b> to download the posed figure, <b>To refs</b> to save it as a Pose reference, or <b>To panel</b> to place it in a panel as a rough to draw over. It's a planning tool — the final art is yours.</li></ul></details>
<details><summary>Panels, bubbles and captions</summary><ul>
<li>Choose the page at the top (◀ ▶ switch pages, + adds a page, the sliders icon opens page settings: size, paper color, chapter).</li>
<li><b>Tap</b> a panel or element to select it, <b>drag</b> to move it, use the <b>corner dots</b> to resize. Tap the same spot again to select what's underneath (e.g. the panel behind a picture).</li>
<li>Drag the grey area (or empty space) to scroll. Pinch or use the zoom buttons. “Fit” shows the whole page.</li>
<li>New images, bubbles, captions and SFX go into the selected panel (or panel 1). Edit their text and style in the box below the page; tap <b>Hide</b> to give the page more room.</li>
<li>Drag the <b>orange dot</b> to aim a bubble's tail at the speaker. Set the <b>Speaker</b> so the Script lists who says what.</li>
<li>Blue numbers show the reading order; change it with <b>Earlier / Later</b> or “Reading order”. Bubbles inside a panel are read from back to front.</li>
<li>Images stay inside their panel border unless you untick “Keep inside the panel border” (great for characters breaking the frame).</li></ul></details>
<details><summary>Storyboard & chapters</summary><ul>
<li>Chapters run top to bottom; pages left to right. ◀ ▶ under a page change its position; ⋯ duplicates, moves it to another chapter, sets panel order, exports or deletes it.</li>
<li>Edit chapter titles directly. “Notes & more…” holds a synopsis and lets you change the code or delete a chapter.</li>
<li><b>Script</b> collects every caption and line of dialogue in reading order so you can proofread or share it.</li></ul></details>
<details><summary>Exporting images</summary><ul>
<li>Export one page, a whole chapter as separate images, a chapter as <b>one tall image</b> (good for vertical scrolling posts), or the whole comic.</li>
<li>PNG keeps the best quality; JPEG makes smaller files. “Large 2×” is for print.</li></ul></details>
<details><summary>Working offline & on Android</summary><ul>
<li><b>Android app:</b> exported pages and pose images go to your gallery (<b>Pictures/HELIRUBY</b>); project files and scripts go to <b>Download/HELIRUBY</b>. To move to a new phone, save a project file and open it there.</li>
<li>This is a single HTML file with nothing to download from the internet, so it works offline.</li>
<li>Best on Android: open it in <b>Chrome</b> from a web address (for example GitHub Pages), then use Chrome's menu → <b>Add to Home screen</b> so it opens like an app.</li>
<li>Keyboard shortcuts on a computer: <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo, <kbd>Ctrl</kbd>+<kbd>Y</kbd> redo, <kbd>Delete</kbd> removes the selection.</li></ul></details>
<details><summary>Tips for a beginner comic artist</summary><ul>
<li>Plan before you draw: rough layout → dialogue → stick figures (or a puppet pose) → final art. Changing a sketch is cheap; changing finished art isn't.</li>
<li>One clear moment per panel. Vary shot size: a wide shot to show where they are, close-ups for feelings.</li>
<li>Keep bubbles short (under ~25 words) and place them in reading order: top-to-bottom, left-to-right. Leave room for bubbles when drawing.</li>
<li>For quiet, emotional beats (and this story has many), a wordless panel or extra white space can say more than dialogue.</li>
<li>Keep your references open while drawing: same hair parting, ear accessories and uniform details every time.</li></ul></details>`;

  pupExport:async()=>{const rig=curRig();if(!rig.parts.length)return toast('Add some parts first.','err');const c=await rigCanvas(rig,false);const b=await canvasBlob(c,'image/png');const w=await downloadBlob(b,`${slug(charById(ui.puppetChar).name)}_pose.png`);toast(`Pose image saved to ${w}.`,'ok');},
  pupToRefs:async()=>{const rig=curRig();if(!rig.parts.length)return toast('Add some parts first.','err');const c=await rigCanvas(rig,true);const im=await canvasToImage(c);
    project.refs.push({id:uid('ref'),charId:ui.puppetChar,imgId:im.id,w:im.w,h:im.h,label:'Puppet pose '+new Date().toLocaleString(),cat:'pose',source:'puppet',tags:'puppet',notes:'',fav:false,added:Date.now()});commit();toast(`Saved to ${charById(ui.puppetChar).name} → Pose (marked “Puppet”).`,'ok');},
  pupToPanel:async()=>{const rig=curRig();if(!rig.parts.length)return toast('Add some parts first.','err');if(!curPage())return toast('Create a page first.','err');const c=await rigCanvas(rig,true);const im=await canvasToImage(c);
    if(await addImageToPanel({imgId:im.id,w:im.w,h:im.h})){setTab('pages');toast('Pose placed in the panel as a guide. Lower its opacity to draw over it.');}},
  /* editor */
  pgPrev:()=>{const ids=allPageIds(),i=ids.indexOf(ui.pageId);if(i>0){ui.pageId=ids[i-1];ED.sel=null;saveUI();renderEditor();}},
  pgNext:()=>{const ids=allPageIds(),i=ids.indexOf(ui.pageId);if(i>=0&&i<ids.length-1){ui.pageId=ids[i+1];ED.sel=null;saveUI();renderEditor();}},
  addPageHere:()=>{const ch=chapterOf(ui.pageId)||project.chapters[0];if(!ch)return toast('Create a chapter first.','err');const pg=addPageTo(ch,ui.pageId);ui.pageId=pg.id;ED.sel=null;commit();saveUI();renderEditor();toast('Added '+pageLabel(pg.id));},
  pageSettings:()=>openPageSettings(),
  layout:()=>openLayout(),
  addPanel:()=>{const pg=curPage();if(!pg)return;const n=pg.panels.length;const w=Math.round((pg.w-2*pg.margin)*.6),h=Math.round(pg.h*.22);
    const pn=Object.assign(panelDefaults(),{x:pg.margin+(n%4)*30,y:pg.margin+(n%4)*30,w,h,border:Math.max(2,Math.round(pg.w/200))});pg.panels.push(pn);ED.sel={kind:'panel',panelId:pn.id};commit();renderProps();edView.draw();toast('Panel added. Drag it; use the corner dots to resize.');},
  addImage:()=>addImageToPanel().then(ok=>{if(ok){renderProps();edView.draw();}}),
  addBubble:b=>addBubble(b.dataset.style),
  addSfx:()=>addSfx(),
  preview:()=>{const ids=allPageIds();openReader(ids,ids.indexOf(ui.pageId));},
  exportOpen:()=>openExport(ui.pageId),
  selPanel:b=>{ED.sel={kind:'panel',panelId:b.dataset.id};renderProps();edView.draw();},
  selItem:b=>{const pg=curPage();const pn=pg&&pg.panels.find(p=>p.items.some(i=>i.id===b.dataset.id));if(!pn)return;ED.sel={kind:'item',panelId:pn.id,itemId:b.dataset.id};renderProps();edView.draw();},
  toggleOrder:()=>{ui.showOrder=!ui.showOrder;saveUI();renderProps();edView.draw();},
  panelOrder:b=>{if(b.closest('.modal'))closeModal();openPanelOrder(b.dataset.id||ui.pageId);},
  panelUp:()=>{const so=selObjs();if(!so)return;const P=so.pg.panels,i=P.indexOf(so.pn);if(i<=0)return;[P[i-1],P[i]]=[P[i],P[i-1]];commit();renderProps();edView.draw();},
  panelDown:()=>{const so=selObjs();if(!so)return;const P=so.pg.panels,i=P.indexOf(so.pn);if(i>=P.length-1)return;[P[i+1],P[i]]=[P[i],P[i+1]];commit();renderProps();edView.draw();},
  panelDup:()=>{const so=selObjs();if(!so)return;const c=deep(so.pn);c.id=uid('pn');c.items.forEach(it=>it.id=uid('it'));const off=30;c.x+=off;c.y+=off;shiftItems(c,off,off);so.pg.panels.splice(so.pg.panels.indexOf(so.pn)+1,0,c);ED.sel={kind:'panel',panelId:c.id};commit();renderProps();edView.draw();},
  panelDel:async()=>{const so=selObjs();if(!so||so.it)return;if(so.pn.items.length&&!await ask({title:'Delete this panel?',msg:`It contains ${so.pn.items.length} element(s). You can undo.`,ok:'Delete',danger:true}))return;so.pg.panels.splice(so.pg.panels.indexOf(so.pn),1);ED.sel=null;commit();renderProps();edView.draw();},
  panelBg:async()=>{const pn=targetPanel();if(!pn)return toast('Add a panel first.','err');ED.sel={kind:'panel',panelId:pn.id};const pick=await pickImage('Choose a panel background');if(!pick)return;pn.bgImg=pick.imgId;commit();renderProps();edView.draw();},
  panelBgClear:()=>{const so=selObjs();if(!so)return;so.pn.bgImg=null;commit();renderProps();edView.draw();},
  itemUp:()=>{const so=selObjs();if(!so||!so.it)return;const A=so.pn.items,i=A.indexOf(so.it);if(i>=A.length-1)return;[A[i+1],A[i]]=[A[i],A[i+1]];commit();renderProps();edView.draw();},
  itemDown:()=>{const so=selObjs();if(!so||!so.it)return;const A=so.pn.items,i=A.indexOf(so.it);if(i<=0)return;[A[i-1],A[i]]=[A[i],A[i-1]];commit();renderProps();edView.draw();},
  itemDup:()=>{const so=selObjs();if(!so||!so.it)return;const c=deep(so.it);c.id=uid('it');c.x+=24;c.y+=24;if(c.type==='bubble'){c.tx+=24;c.ty+=24;}so.pn.items.push(c);selectItem(so.pn,c);commit();renderProps();edView.draw();},
  itemDel:()=>{const so=selObjs();if(!so||!so.it)return;so.pn.items.splice(so.pn.items.indexOf(so.it),1);ED.sel={kind:'panel',panelId:so.pn.id};commit();renderProps();edView.draw();toast('Deleted. Undo to bring it back.');},
  imgFill:()=>{const so=selObjs();if(!so||!so.it)return;const it=so.it,pn=so.pn;const k=Math.max(pn.w/it.w,pn.h/it.h);it.w*=k;it.h*=k;it.x=pn.x+(pn.w-it.w)/2;it.y=pn.y+(pn.h-it.h)/2;it.rot=0;commit();renderProps();edView.draw();},
  imgFit:()=>{const so=selObjs();if(!so||!so.it)return;const it=so.it,pn=so.pn;const k=Math.min(pn.w/it.w,pn.h/it.h);it.w*=k;it.h*=k;it.x=pn.x+(pn.w-it.w)/2;it.y=pn.y+(pn.h-it.h)/2;it.rot=0;commit();renderProps();edView.draw();},
  imgFlip:()=>{const so=selObjs();if(!so||!so.it)return;so.it.flip=!so.it.flip;commit();edView.draw();},
  imgReplace:async()=>{const so=selObjs();if(!so||!so.it)return;const pick=await pickImage('Replace image');if(!pick)return;const it=so.it;const cx=it.x+it.w/2,cy=it.y+it.h/2;const f=fitInto(pick.w,pick.h,it.w,it.h);
    it.imgId=pick.imgId;it.w=f.w;it.h=f.h;it.x=cx-f.w/2;it.y=cy-f.h/2;commit();renderProps();edView.draw();},
  tailReset:()=>{const so=selObjs();if(!so||!so.it)return;const it=so.it;it.tail=true;it.tx=it.x+it.w*.35;it.ty=it.y+it.h+Math.min(so.pn.h*.25,120);commit();renderProps();edView.draw();},
  /* storyboard */
  readAll:()=>openReader(allPageIds(),0),
  readChapter:b=>{const ch=project.chapters.find(c=>c.id===b.dataset.ch);if(ch)openReader(ch.pages,0);},
  script:()=>openScript(),
  copyScript:async()=>{const s=buildScript();try{await navigator.clipboard.writeText(s);toast('Script copied.','ok');}catch(e){const t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}t.remove();toast(ok?'Script copied.':'Copy is blocked here — use “Save .txt”.',ok?'ok':'err');}},
  dlScript:async()=>{const w=await downloadBlob(new Blob([buildScript()],{type:'text/plain;charset=utf-8'}),`${slug(project.title)}_script.txt`);toast(`Script saved to ${w}.`,'ok');},
  addChapter:async()=>{const t=await ask({title:'New chapter',input:'',ph:'Chapter title',ok:'Add'});if(t===null)return;project.chapters.push({id:uid('ch'),code:'C'+(project.chapters.length+1),title:t||'Untitled',notes:'',pages:[]});commit();renderStory();},
  addPage:b=>{const ch=project.chapters.find(c=>c.id===b.dataset.ch)||project.chapters[0];if(!ch)return;const pg=addPageTo(ch);ui.pageId=pg.id;ED.sel=null;commit();saveUI();while(modals.length)closeModal();
    if(ui.tab==='story'){renderStory();toast(`Added ${pageLabel(pg.id)}. Tap it to edit.`);}else renderTab(ui.tab);},
  openPage:b=>{ui.pageId=b.dataset.id;ED.sel=null;saveUI();while(modals.length)closeModal();setTab('pages');},
  pgMove:b=>{const pid=b.dataset.id,ch=chapterOf(pid);const i=ch.pages.indexOf(pid),j=i+(+b.dataset.d);if(j<0||j>=ch.pages.length)return;[ch.pages[i],ch.pages[j]]=[ch.pages[j],ch.pages[i]];commit();renderStory();},
  pgPreview:b=>{const ids=allPageIds();openReader(ids,ids.indexOf(b.dataset.id));},
  pgMore:b=>openPageMore(b.dataset.id),
  pgDup:b=>{const pg=project.pages[b.dataset.id];if(!pg)return;const c=cloneWithIds(pg);c.name=pg.name?pg.name+' (copy)':'';project.pages[c.id]=c;const ch=chapterOf(pg.id);ch.pages.splice(ch.pages.indexOf(pg.id)+1,0,c.id);commit();closeModal();toast('Page duplicated.');},
  pgExport:b=>{closeModal();openExport(b.dataset.id,'page');},
  pgDel:async b=>{closeModal();await deletePage(b.dataset.id);},
  chMove:b=>{const C=project.chapters,i=C.findIndex(c=>c.id===b.dataset.ch),j=i+(+b.dataset.d);if(i<0||j<0||j>=C.length)return;[C[i],C[j]]=[C[j],C[i]];commit();renderStory();},
  chMore:b=>openChapterMore(b.dataset.ch),
  chDel:async b=>{const ch=project.chapters.find(c=>c.id===b.dataset.ch);if(!ch)return;if(project.chapters.length===1)return toast('Keep at least one chapter.','err');
    if(!await ask({title:`Delete ${esc(ch.code)}: ${esc(ch.title)}?`,msg:`Its ${ch.pages.length} page(s) will be deleted too. You can undo right after.`,ok:'Delete chapter',danger:true}))return;
    ch.pages.forEach(id=>delete project.pages[id]);project.chapters.splice(project.chapters.indexOf(ch),1);commit();while(modals.length)closeModal();renderTab(ui.tab);},
  exportChapter:b=>{const ch=project.chapters.find(c=>c.id===b.dataset.ch);if(ch&&ch.pages.length)openExport(ch.pages[0],'chapter');},
  rdPrev:()=>{if(RD&&RD.idx>0){RD.idx--;drawReader();}},
  rdNext:()=>{if(RD&&RD.idx<RD.ids.length-1){RD.idx++;drawReader();}},
  rdEdit:()=>{if(!RD)return;ui.pageId=RD.ids[RD.idx];ED.sel=null;saveUI();while(modals.length)closeModal();setTab('pages');},
  rdExport:()=>{if(!RD)return;const pid=RD.ids[RD.idx];closeModal();openExport(pid,'page');},
  /* more */
  theme:b=>{ui.theme=b.dataset.v;saveUI();applyTheme();renderMore();},
  saveFile:async()=>{await saveNow();const ids=[...referencedImageIds()];const parts=['{"app":"heliruby-studio","version":1,"saved":',String(Date.now()),',"project":',JSON.stringify(project),',"images":{'];let first=true;
    for(const id of ids){const d=memImages.get(id);if(!d)continue;parts.push((first?'':',')+JSON.stringify(id)+':'+JSON.stringify(d));first=false;}parts.push('}}');
    const blob=new Blob(parts,{type:'application/json'});const w=await downloadBlob(blob,`heliruby-project-${dateStr()}.json`);toast(`Project file saved to ${w} (${(blob.size/1048576).toFixed(1)} MB). Keep a copy somewhere safe!`,'ok');},
  openFile:async()=>{const[f]=await pickFiles({accept:'',multiple:false});if(!f)return;let data;try{toast('Reading project file…');data=JSON.parse(await f.text());}catch(e){return toast('That file is not a HELIRUBY Studio project file (it could not be read as JSON).','err');}
    if(!data||data.app!==APP_ID||!data.project)return toast("This doesn't look like a HELIRUBY Studio project file.",'err');
    if(!await ask({title:'Open this project?',msg:'It will <b>replace</b> the project currently stored in this browser. Save a project file first if you want to keep the current one.',ok:'Replace & open',danger:true}))return;
    let p;try{p=normalize(data.project);}catch(e){return toast('The project file is damaged: '+e.message,'err');}await replaceProject(p,data.images);toast('Project opened.','ok');},
  newProject:async()=>{if(!await ask({title:'Start a new empty project?',msg:'Everything in this browser (pages, references, images) will be replaced. Save a project file first if you want to keep it.',ok:'Start new project',danger:true}))return;await replaceProject(newProject(),{});toast('New project ready.','ok');},
  cleanImages:async()=>{const used=referencedImageIds();const snaps=hist.undo.concat(hist.redo).join('\n');const junk=[...memImages.keys()].filter(id=>!used.has(id)&&!snaps.includes(id));
    if(!junk.length)return toast('No unused images found.');if(!await ask({title:`Remove ${junk.length} unused image(s)?`,msg:'These images are not used by any reference, panel or puppet.',ok:'Remove',danger:true}))return;
    for(const id of junk){try{await deleteImage(id);}catch(e){}}toast(`Removed ${junk.length} unused image(s).`,'ok');renderMore();},
  persist:async()=>{if(NATIVE)return toast('In the app, your work is kept until you uninstall it. Still save project files as a backup.','ok');if(!(navigator.storage&&navigator.storage.persist))return toast('This browser does not support that option. Keep saving project files.');try{const ok=await navigator.storage.persist();toast(ok?'The browser will try to keep your data.':'The browser declined (common until a site is bookmarked or installed). Keep saving project files.',ok?'ok':'');}catch(e){reportErr(e);}}
};

/* ---------- delegated events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const fn=ACT[b.dataset.act];if(!fn){console.warn('Unknown action',b.dataset.act);return;}
  try{const r=fn(b,e);if(r&&r.catch)r.catch(reportErr);}catch(err){reportErr(err);}});
const SCOPES={panel:()=>selObjs()?.pn,item:()=>selObjs()?.it,page:()=>curPage(),part:()=>curPart(),rig:()=>curRig(),project:()=>project,
  ref:el=>project.refs.find(r=>r.id===el.dataset.id),char:el=>charById(el.dataset.id),chapter:el=>project.chapters.find(c=>c.id===el.dataset.id)};
const AFTER={
  panel:()=>edView.draw(),page:()=>edView.draw(),
  item:(el,key,type)=>{edView.draw();if(type==='change'&&(el.tagName==='SELECT'||el.type==='checkbox'))renderProps();},
  part:(el,key,type)=>{pupView.draw();if(type==='change'&&key==='name')renderPupProps();},
  rig:(el,key)=>{if(key==='w'||key==='h')pupView.layout();else pupView.draw();},
  ref:()=>renderRefGrid(),
  char:(el,key)=>{if(key==='name'){$$(`[data-act="setChar"][data-id="${el.dataset.id}"] .nm`).forEach(n=>n.textContent=el.value);const pn=$('#profileBox .pname');if(pn)pn.textContent=el.value;}
    if(key==='color'){$$(`[data-act="setChar"][data-id="${el.dataset.id}"] .dot`).forEach(d=>d.style.background=el.value);const a=$('#profileBox .avatar');if(a)a.style.borderColor=el.value;}},
  chapter:()=>{},project:()=>updateTitle()};
function onBind(e){const el=e.target;
  if(el.id==='refSearch'){ui.q=el.value;renderRefGrid();return;}
  if(el.id==='srcSel'){ui.src=el.value;saveUI();renderRefGrid();return;}
  if(el.id==='pageSel'){if(e.type==='change'){ui.pageId=el.value;ED.sel=null;saveUI();renderEditor();}return;}
  if(el.dataset&&el.dataset.addcolor){if(e.type!=='change')return;const c=charById(el.dataset.addcolor);if(c){c.palette.push(hex6(el.value));commit();renderRefs();}return;}
  if(!el.dataset||!el.dataset.b)return;const[scope,key]=el.dataset.b.split(':');const obj=SCOPES[scope]&&SCOPES[scope](el);if(!obj)return;
  let v;if(el.type==='checkbox')v=el.checked;else if(el.type==='number'||el.type==='range'){v=parseFloat(el.value);if(!isFinite(v))return;if(el.dataset.mul)v/=+el.dataset.mul;if(el.dataset.min!=null)v=Math.max(+el.dataset.min,v);}else v=el.value;
  if(obj[key]===v&&e.type==='change')return;
  if(scope==='panel'&&(key==='x'||key==='y')){const d=v-obj[key];shiftItems(obj,key==='x'?d:0,key==='y'?d:0);}
  if(scope==='item'&&obj.type==='bubble'&&(key==='x'||key==='y')){const d=v-obj[key];if(key==='x')obj.tx+=d;else obj.ty+=d;}
  if(scope==='rig'&&(key==='w'||key==='h'))v=clamp(Math.round(v),200,5000);
  obj[key]=v;const out=el.type==='range'&&el.parentElement.querySelector('output');if(out)out.textContent=fmtN(v*(+el.dataset.mul||1))+(el.dataset.suf||'');
  AFTER[scope]&&AFTER[scope](el,key,e.type);commit(e.type==='input');}
document.addEventListener('input',onBind);document.addEventListener('change',onBind);
document.addEventListener('toggle',e=>{if(e.target.id==='profileBox'){ui.profileOpen=e.target.open;saveUI();}},true);
document.addEventListener('keydown',e=>{const typing=e.target.matches&&e.target.matches('input,textarea,select');
  if(e.key==='Escape'&&modals.length){closeModal();return;}if(typing)return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?ACT.redo():ACT.undo();}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();ACT.redo();}
  else if((e.key==='Delete'||e.key==='Backspace')&&!modals.length){if(ui.tab==='pages'&&ED.sel){ED.sel.kind==='panel'?ACT.panelDel():ACT.itemDel();}else if(ui.tab==='puppet'&&PUP.sel)ACT.partDel();}});
window.addEventListener('resize',()=>{if(RD)drawReader();});

/* ---------- tabs / chrome ---------- */
const TABS=[['refs','References','image'],['puppet','Puppet','puppet'],['pages','Panels','layout'],['story','Storyboard','story'],['more','More','more']];
function setTab(t){if(!TABS.some(x=>x[0]===t))t='refs';ui.tab=t;saveUI();$$('.tab').forEach(s=>s.classList.toggle('active',s.id==='tab-'+t));$$('#tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));renderTab(t);}
function renderTab(t){if(t==='refs')renderRefs();else if(t==='puppet')renderPuppet();else if(t==='pages')renderEditor();else if(t==='story')renderStory();else renderMore();}
function redrawAll(){if(ui.tab==='pages')edView.draw();else if(ui.tab==='puppet')pupView.draw();else if(ui.tab==='story')drawStoryThumbs();if(RD)drawReader();}
function updateTitle(){$('#projTitle').textContent=project.title||'Untitled';document.title='HELIRUBY Studio — '+(project.title||'');}
function applyTheme(){const r=document.documentElement;if(ui.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',ui.theme);}
function buildChrome(){
  $('#tabbar').innerHTML=TABS.map(([id,n,ic])=>`<button data-act="tab" data-tab="${id}" aria-label="${n}">${I(ic)}<span>${n}</span></button>`).join('');
  $('#undoBtn').innerHTML=I('undo');$('#redoBtn').innerHTML=I('redo');$('#pgPrevBtn').innerHTML=I('left');$('#pgNextBtn').innerHTML=I('right');$('#pgAddBtn').innerHTML=I('plus');$('#pgSetBtn').innerHTML=I('sliders');
  const tool=(act,ic,label,extra='')=>`<button class="tool" data-act="${act}" ${extra}>${I(ic)}<span>${label}</span></button>`;
  $('#edTools').innerHTML=tool('layout','layout','Layout')+tool('addPanel','plus','Panel')+tool('addImage','image','Image')+tool('addBubble','bubble','Speech','data-style="speech"')+tool('addBubble','cloud','Thought','data-style="thought"')
   +tool('addBubble','shout','Shout','data-style="shout"')+tool('addBubble','caption','Caption','data-style="caption"')+tool('addSfx','zap','SFX')+tool('panelBg','bgimg','Backgr.')
   +tool('preview','eye','Preview')+tool('exportOpen','download','Export')+tool('zoomOut','zout','Zoom −','data-view="ed"')+tool('zoomFit','fit','Fit','data-view="ed"')+tool('zoomIn','zin','Zoom +','data-view="ed"');
  $('#pupTools').innerHTML=tool('addParts','upload','Add parts')+tool('partsFromRefs','image','From refs')+tool('pupStage','sliders','Stage')+tool('pupPoses','pose','Poses')
   +tool('pupExport','download','PNG')+tool('pupToRefs','save','To refs')+tool('pupToPanel','layout','To panel')+tool('zoomOut','zout','Zoom −','data-view="pup"')+tool('zoomFit','fit','Fit','data-view="pup"')+tool('zoomIn','zin','Zoom +','data-view="pup"');}

/* ---------- boot ---------- */
async function boot(){applyTheme();buildChrome();
  try{db=await openDB();}catch(e){db=null;console.warn(e);}
  let loaded=null;
  if(db){try{const s=await idb('kv','readonly',st=>st.get('project'));if(s)loaded=JSON.parse(s);await loadAllImages();}catch(e){console.error(e);toast('Could not read the saved project: '+friendlyErr(e),'err');}}
  try{project=normalize(loaded||newProject());}catch(e){toast('Saved project was damaged; starting fresh. Open a project file to restore.','err');project=newProject();}
  hist.last=JSON.stringify(project);updateUndoBtns();updateTitle();
  edView=new View($('#edWrap'),$('#edCanvas'),edOpts);pupView=new View($('#pupWrap'),$('#pupCanvas'),pupOpts);
  if(db){if(!loaded){dirty=true;saveNow();}else setStatus('Saved ✓','ok');}else{setStatus('Not stored — save a file','warn');toast('This browser is blocking storage here, so autosave is off. Use More → Save project file to keep your work.','err');}
  setTab(ui.tab);if(!ui.seenWelcome)showWelcome();}
boot().catch(e=>{console.error(e);document.body.insertAdjacentHTML('afterbegin',`<p style="padding:16px;background:#fde;color:#600">HELIRUBY Studio failed to start: ${esc(friendlyErr(e))}. Try reloading, or use a recent version of Chrome.</p>`);});
</script>
