<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Lona — Pan de muerto RRISS</title>
<style>
@font-face { font-family: "DM Serif Display"; src: url("assets/dm-serif-display-latin-400-normal.woff2") format("woff2"); font-style: normal; }
@font-face { font-family: "DM Serif Display"; src: url("assets/dm-serif-display-latin-400-italic.woff2") format("woff2"); font-style: italic; }
@font-face { font-family: "Outfit"; src: url("assets/outfit-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Outfit"; src: url("assets/outfit-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
@font-face { font-family: "JetBrains Mono"; src: url("assets/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }

:root { --navy: #0D1E4A; --blue: #1F3E86; --cream: #F7F1E3; --gold: #C9A24A; --gold-hi: #E8C873; --orange: #F28C1B; }
@page { size: 200cm 100cm; margin: 0; }
@media print { body { zoom: 3.7795; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 2000px; height: 1000px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 62% 48%, #2A4FA0 0%, var(--blue) 35%, var(--navy) 100%); font-family: "Outfit", sans-serif; color: var(--cream); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.dots { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(232,200,115,0.16) 2.5px, transparent 3px); background-size: 34px 34px; }
.serif { font-family: "DM Serif Display", serif; font-weight: 400; }
.mono { font-family: "JetBrains Mono", monospace; letter-spacing: 0.16em; }
svg { position: absolute; overflow: visible; }

.text { position: absolute; left: 110px; top: 246px; }
.kicker { display: flex; align-items: center; gap: 16px; font-size: 26px; color: var(--gold-hi); }
.kicker i { width: 18px; height: 18px; background: var(--orange); display: block; transform: rotate(45deg); }
.pre { margin-top: 18px; font-weight: 800; font-size: 74px; line-height: 1; }
.big { font-size: 224px; line-height: 0.9; margin-top: 8px; }
.big.two { color: var(--gold-hi); font-style: italic; }
.sub { margin-top: 26px; font-weight: 600; font-size: 46px; color: #DCE5F7; }
.sub b { color: var(--orange); font-weight: 800; }

.band { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; background: #081333; border-top: 6px solid var(--gold); display: flex; align-items: center; padding: 0 110px; gap: 40px; }
.logo { display: flex; align-items: baseline; gap: 18px; }
.logo .w { font-size: 66px; line-height: 1; color: var(--cream); }
.logo .s { font-size: 34px; font-style: italic; color: var(--gold-hi); }
.tagline { font-size: 22px; color: #C9D5EE; }
.cta { margin-left: auto; padding: 14px 40px 12px; border-radius: 999px; background: var(--gold-hi); color: var(--navy); font-weight: 800; font-size: 40px; }
</style>
</head>
<body>
<div class="dots"></div>

<svg id="picado" width="2000" height="240" style="left:0;top:0"></svg>

<div class="text">
  <div class="kicker mono"><i></i>TEMPORADA DE DÍA DE MUERTOS</div>
  <div class="pre">¡Ya llegó el</div>
  <div class="big serif">Pan de</div>
  <div class="big two serif">muerto!</div>
  <div class="sub">Recién horneado en <b>RRISS</b></div>
</div>

<svg id="pan" width="940" height="658" viewBox="0 0 800 560" style="left:1040px;top:178px">
  <defs>
    <radialGradient id="g-body" cx="44%" cy="28%" r="75%">
      <stop offset="0" stop-color="#F3C877" />
      <stop offset="0.45" stop-color="#D99A45" />
      <stop offset="0.82" stop-color="#A8642A" />
      <stop offset="1" stop-color="#7A4218" />
    </radialGradient>
    <radialGradient id="g-bone" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#F0BC69" />
      <stop offset="1" stop-color="#B26B2C" />
    </radialGradient>
    <linearGradient id="g-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3D88E" />
      <stop offset="1" stop-color="#A9802F" />
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12" /></filter>
  </defs>
  <ellipse cx="400" cy="478" rx="378" ry="72" fill="url(#g-plate)" />
  <ellipse cx="400" cy="470" rx="335" ry="54" fill="#E8C873" opacity="0.55" />
  <ellipse cx="400" cy="458" rx="300" ry="42" fill="#3A1E08" opacity="0.45" filter="url(#blur)" />
  <path d="M120 440 C 105 245, 695 245, 680 440 C 600 485, 200 485, 120 440 Z" fill="url(#g-body)" />
  <g id="bones"></g>
  <circle cx="400" cy="256" r="50" fill="url(#g-bone)" stroke="#8C4E1E" stroke-width="2" />
  <ellipse cx="384" cy="238" rx="18" ry="11" fill="#FFF3D6" opacity="0.45" />
  <ellipse cx="300" cy="320" rx="120" ry="40" fill="#FFFFFF" opacity="0.10" />
  <g id="sugar"></g>
</svg>

<svg id="flowers" width="2000" height="1000" style="left:0;top:0"></svg>

<div class="band">
  <div class="logo"><span class="w serif">RRISS</span><span class="s serif">Bread &amp; Coffee</span></div>
  <div class="tagline mono">PANADERÍA · PASTELERÍA · CAFÉ</div>
  <div class="cta">Pedidos por WhatsApp</div>
</div>

<script>
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  function rng(seed) {
    return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const R = rng(2026);

  // papel picado
  const pic = document.getElementById("picado");
  el("path", { d: "M0 34 Q1000 70 2000 34", fill: "none", stroke: "#E8C873", "stroke-width": 4 }, pic);
  const colors = ["#E8C873", "#F7F1E3", "#F28C1B", "#7A9BD8", "#E8C873", "#F7F1E3", "#F28C1B", "#7A9BD8", "#E8C873"];
  const defs = el("defs", {}, pic);
  for (let i = 0; i < 9; i++) {
    const x = 20 + i * 220, w = 200, h = 172;
    const y = 34 + 36 * (1 - Math.pow((x + w / 2 - 1000) / 1000, 2)) - 4;
    const m = el("mask", { id: "m" + i, maskUnits: "userSpaceOnUse" }, defs);
    el("rect", { x: x - 10, y: y - 10, width: w + 20, height: h + 40, fill: "#fff" }, m);
    for (let k = 0; k < 6; k++) {
      const cx = x + 22 + k * 31.2, cy = y + 30;
      el("path", { d: `M${cx} ${cy - 10} L${cx + 9} ${cy} L${cx} ${cy + 10} L${cx - 9} ${cy} Z`, fill: "#000" }, m);
    }
    const fx = x + w / 2, fy = y + 92;
    el("circle", { cx: fx, cy: fy, r: 15, fill: "#000" }, m);
    for (let p = 0; p < 8; p++) {
      const a = (p / 8) * Math.PI * 2;
      el("ellipse", { cx: fx + Math.cos(a) * 36, cy: fy + Math.sin(a) * 36, rx: 12, ry: 7, transform: `rotate(${(a * 180) / Math.PI} ${fx + Math.cos(a) * 36} ${fy + Math.sin(a) * 36})`, fill: "#000" }, m);
    }
    for (let k = 0; k < 4; k++) el("circle", { cx: x + 30 + k * 47, cy: y + 146, r: 7, fill: "#000" }, m);
    let d = `M${x} ${y} L${x + w} ${y} L${x + w} ${y + h}`;
    for (let k = 5; k >= 0; k--) {
      const sx = x + (k * w) / 6;
      d += ` Q${sx + w / 12} ${y + h + 18} ${sx} ${y + h}`;
    }
    d += " Z";
    el("path", { d, fill: colors[i], mask: `url(#m${i})`, opacity: 0.96, transform: `rotate(${(i % 2 ? 1 : -1) * 2.5} ${x + w / 2} ${y})` }, pic);
  }

  // huesitos
  const bones = document.getElementById("bones");
  const ends = [[150, 408], [650, 408], [292, 458], [512, 458]];
  ends.forEach(([ex, ey]) => {
    const sx = 400, sy = 268, steps = 9;
    for (let s = 1; s <= steps; s++) {
      const t = s / steps;
      const px = sx + (ex - sx) * t, py = sy + (ey - sy) * t - Math.sin(t * Math.PI) * 26;
      const len = Math.hypot(ex - sx, ey - sy);
      const nx = -(ey - sy) / len, ny = (ex - sx) / len;
      const off = (s % 2 ? 1 : -1) * 7;
      el("circle", { cx: px + nx * off, cy: py + ny * off, r: 24 - t * 7, fill: "url(#g-bone)", stroke: "#8C4E1E", "stroke-width": 1.5 }, bones);
    }
  });

  // sugar
  const sugar = document.getElementById("sugar");
  let placed = 0;
  while (placed < 420) {
    const x = 120 + R() * 560, y = 250 + R() * 200;
    if (((x - 400) / 272) ** 2 + ((y - 445) / 192) ** 2 > 1 || y > 448) continue;
    el("circle", { cx: x, cy: y, r: 1.8 + R() * 3.2, fill: R() > 0.25 ? "#FFFFFF" : "#FBEFD2", opacity: 0.75 + R() * 0.25 }, sugar);
    placed++;
  }

  // cempasúchil
  const fl = document.getElementById("flowers");
  const petal = ["#F28C1B", "#F7A531", "#E87511", "#FBB848"];
  function flower(cx, cy, r) {
    const g = el("g", {}, fl);
    for (let L = 0; L < 5; L++) {
      const n = 18 - L * 3, rr = r * (0.82 - L * 0.17), pr = r * (0.3 - L * 0.035);
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + L * 0.35;
        el("circle", { cx: cx + Math.cos(a) * rr, cy: cy + Math.sin(a) * rr * 0.92, r: pr, fill: petal[(i + L) % petal.length], stroke: "#C8600A", "stroke-width": 1 }, g);
      }
    }
    el("circle", { cx, cy, r: r * 0.14, fill: "#B5520A" }, g);
  }
  [[1105, 815, 74], [1225, 865, 52], [1885, 800, 80], [1775, 868, 54], [1955, 690, 46], [1060, 690, 40]].forEach(([x, y, r]) => flower(x, y, r));
  for (let i = 0; i < 26; i++) {
    const x = 1040 + R() * 940, y = 860 + R() * 30;
    el("ellipse", { cx: x, cy: y, rx: 9, ry: 5, fill: petal[i % 4], transform: `rotate(${R() * 180} ${x} ${y})` }, fl);
  }
</script>
</body>
</html>
